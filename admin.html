
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Cinema | Admin</title>
<style>
:root{--bg:#101020;--panel:#1d1d32;--gold:#f6ca55;--muted:#c4c4d2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif}
header{background:#080812;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
header a{color:var(--gold);text-decoration:none}
.brand{font-size:24px;font-weight:bold;color:var(--gold)}
main{max-width:900px;margin:30px auto;padding:0 18px}
.panel{background:var(--panel);border:1px solid #36364d;border-radius:14px;padding:22px;margin-bottom:22px}
h2{color:var(--gold);margin-top:0}
label{display:block;margin:13px 0 6px}
input,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #55556c;background:#101020;color:white;font:inherit}
textarea{min-height:85px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer;margin:10px 8px 0 0}
.primary{background:var(--gold);color:#171717}
.danger{background:#a93645;color:white}
.edit{background:#424269;color:white}
.item{padding:14px 0;border-bottom:1px solid #414158}
.muted{color:var(--muted);font-size:14px;line-height:1.5}
.warning{background:#3a2b16;border:1px solid #9b742a;padding:14px;border-radius:9px;color:#ffe3a0;line-height:1.5}
#status{margin-top:12px;color:var(--gold)}
</style>
</head>
<body>
<header>
<div class="brand">⭐ STAR CINEMA — ADMIN</div>
<a href="index.html">Otvoriť web ↗</a>
</header>

<main>
<div class="warning">
Administrácia je bez prihlasovania. Verejné zapisovanie do databázy znamená, že obsah môže meniť aj iný návštevník.
</div>

<section class="panel" style="margin-top:22px">
<h2>🎬 Pridať alebo upraviť film</h2>
<form id="filmForm">
<input type="hidden" id="filmId">
<label for="title">Názov filmu *</label>
<input id="title" required maxlength="100">
<label for="description">Popis</label>
<textarea id="description" maxlength="500"></textarea>
<label for="image">URL obrázka/plagátu</label>
<input id="image" type="url" placeholder="https://...">
<label for="date">Dátum premietania</label>
<input id="date" type="date">
<label for="time">Čas premietania</label>
<input id="time" type="time">
<button class="primary" type="submit">Uložiť film</button>
<button class="edit" type="button" id="clearFilm">Vyčistiť formulár</button>
</form>
</section>

<section class="panel">
<h2>📋 Existujúce filmy</h2>
<div id="filmList" class="muted">Načítavam…</div>
</section>

<section class="panel">
<h2>🎟️ Rezervácie lístkov</h2>
<div id="ticketList" class="muted">Načítavam rezervácie…</div>
</section>

<section class="panel">
<h2>📢 Pridať oznam</h2>
<form id="noticeForm">
<label for="noticeText">Text oznamu *</label>
<textarea id="noticeText" required maxlength="500"></textarea>
<button class="primary" type="submit">Pridať oznam</button>
</form>
<div id="noticeList" style="margin-top:15px"></div>
</section>

<p id="status" role="status" aria-live="polite"></p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDt72e7uxTcvoC-JEtF-QWN3hIjrQ6KuPc",
  authDomain: "starcinema-736ca.firebaseapp.com",
  databaseURL: "https://starcinema-736ca-default-rtdb.firebaseio.com/",
  projectId: "starcinema-736ca",
  storageBucket: "starcinema-736ca.firebasestorage.app",
  messagingSenderId: "663535518233",
  appId: "1:663535518233:web:81998faf65206dd38f6088"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const filmsRef = db.ref("starCinema/films");
const noticesRef = db.ref("starCinema/notices");
const ticketsRef = db.ref("starCinema/tickets");

const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])
);
const status = message => $("status").textContent = message;

$("filmForm").addEventListener("submit", async event => {
  event.preventDefault();
  const id = $("filmId").value;
  const film = {
    title: $("title").value.trim(),
    description: $("description").value.trim(),
    image: $("image").value.trim(),
    date: $("date").value,
    time: $("time").value
  };
  if (!film.title) return;

  try {
    if (id) await filmsRef.child(id).update(film);
    else await filmsRef.push(film);
    $("filmForm").reset();
    $("filmId").value = "";
    status("Film bol uložený.");
  } catch (error) {
    status("Chyba pri ukladaní filmu: " + error.message);
  }
});

$("clearFilm").onclick = () => {
  $("filmForm").reset();
  $("filmId").value = "";
};

filmsRef.on("value", snapshot => {
  const entries = Object.entries(snapshot.val() || {});
  $("filmList").innerHTML = entries.length ? entries.map(([id,f]) => `
    <div class="item">
      <strong>${escapeHtml(f.title)}</strong>
      <div class="muted">${escapeHtml(f.date || "")} ${escapeHtml(f.time || "")}<br>${escapeHtml(f.description || "")}</div>
      <button class="edit" type="button" data-edit="${escapeHtml(id)}">Upraviť</button>
      <button class="danger" type="button" data-delete="${escapeHtml(id)}">Vymazať</button>
    </div>
  `).join("") : "Zatiaľ nie sú pridané žiadne filmy.";
}, error => status("Chyba načítania filmov: " + error.message));

$("filmList").addEventListener("click", async event => {
  const editId = event.target.dataset.edit;
  const deleteId = event.target.dataset.delete;

  if (editId) {
    try {
      const snap = await filmsRef.child(editId).get();
      const f = snap.val();
      if (!f) return;
      $("filmId").value = editId;
      $("title").value = f.title || "";
      $("description").value = f.description || "";
      $("image").value = f.image || "";
      $("date").value = f.date || "";
      $("time").value = f.time || "";
      window.scrollTo({top:0,behavior:"smooth"});
    } catch (error) {
      status(error.message);
    }
  }

  if (deleteId && confirm("Naozaj chceš vymazať tento film?")) {
    try {
      await filmsRef.child(deleteId).remove();
      status("Film bol vymazaný.");
    } catch (error) {
      status("Chyba pri mazaní: " + error.message);
    }
  }
});

ticketsRef.on("value", snapshot => {
  const entries = Object.entries(snapshot.val() || {})
    .sort((a,b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

  $("ticketList").innerHTML = entries.length ? entries.map(([id,t]) => `
    <div class="item">
      <strong>${escapeHtml(t.filmTitle || "Film")}</strong>
      <div class="muted">
        Kód: ${escapeHtml(t.code || "")}<br>
        Počet lístkov: ${Number(t.count) || 0} · Cena: 0 €<br>
        ${t.createdAt ? escapeHtml(new Date(t.createdAt).toLocaleString("sk-SK")) : ""}
      </div>
      <button class="danger" type="button" data-ticket-delete="${escapeHtml(id)}">Odstrániť rezerváciu</button>
    </div>
  `).join("") : "Zatiaľ žiadne rezervácie.";
}, error => status("Chyba načítania rezervácií: " + error.message));

$("ticketList").addEventListener("click", async event => {
  const id = event.target.dataset.ticketDelete;
  if (id && confirm("Odstrániť rezerváciu?")) {
    try {
      await ticketsRef.child(id).remove();
      status("Rezervácia bola odstránená.");
    } catch (error) {
      status("Chyba: " + error.message);
    }
  }
});

$("noticeForm").addEventListener("submit", async event => {
  event.preventDefault();
  const text = $("noticeText").value.trim();
  if (!text) return;

  try {
    await noticesRef.push({text, createdAt: Date.now()});
    $("noticeForm").reset();
    status("Oznam bol pridaný.");
  } catch (error) {
    status("Chyba pri pridávaní oznamu: " + error.message);
  }
});

noticesRef.on("value", snapshot => {
  const entries = Object.entries(snapshot.val() || {});
  $("noticeList").innerHTML = entries.length ? entries.map(([id,n]) => `
    <div class="item">
      ${escapeHtml(n.text)}
      <button class="danger" type="button" data-notice-delete="${escapeHtml(id)}">Vymazať oznam</button>
    </div>
  `).join("") : "Zatiaľ žiadne oznamy.";
}, error => status("Chyba načítania oznamov: " + error.message));

$("noticeList").addEventListener("click", async event => {
  const id = event.target.dataset.noticeDelete;
  if (id && confirm("Vymazať tento oznam?")) {
    try {
      await noticesRef.child(id).remove();
      status("Oznam bol vymazaný.");
    } catch (error) {
      status("Chyba: " + error.message);
    }
  }
});
</script>
</body>
</html>
